<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="profile-card">
        <header class="card-header">
            <h1>My Profile</h1>
        </header>

        <main class="card-content">
            <img
                class="profile-picture"
                src="https://i.pravatar.cc/150?img=12"
                alt="Profile picture"
            >

            <h2>akijmong</h2>
            <p class="description">Web Developer</p>

            <table class="info-table">
                <tr>
                    <td>Location</td>
                    <td>Bangkok, Thailand</td>
                </tr>
                <tr>
                    <td>Interests</td>
                    <td>Code & Design</td>
                </tr>
            </table>

            <div class="social-links">
    <a href="https://github.com/" target="_blank" aria-label="GitHub">
        <img src="https://cdn.simpleicons.org/github/181717" alt="GitHub">
    </a>

    <a href="https://www.instagram.com/" target="_blank" aria-label="Instagram">
        <img src="https://cdn.simpleicons.org/instagram/E4405F" alt="Instagram">
    </a>

    <a href="https://www.linkedin.com/" target="_blank" aria-label="LinkedIn">
    <img src="https://upload.wikimedia.org/wikipedia/commons/c/ca/LinkedIn_logo_initials.png" alt="LinkedIn">
</a>
</div>
            <a class="contact-button" href="mailto:hello@example.com">
                Contact
            </a>
        </main>
    </div>

</body>
</html>
