<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNCF Sandwich</title>
    <link rel="stylesheet" href="menu.css">
</head>
<body>

    <main class="sandwich">
        <h1>🥪 SNCF Sandwich</h1>
        <p class="subtitle">Fresh from the railway café</p>

        <input type="checkbox" id="menu-toggle">

        <label for="menu-toggle" class="menu-button">
            Choose your ingredients <span class="arrow">▼</span>
        </label>

        <div class="dropdown">
            <h2>Your ham & cheese sandwich</h2>

            <div class="ingredient">
                <span>🥖</span>
                <div>
                    <strong>French baguette</strong>
                    <p>Fresh and crispy bread</p>
                </div>
                <span class="status">✓</span>
            </div>

            <div class="ingredient">
                <span>🍖</span>
                <div>
                    <strong>Ham</strong>
                    <p>Classic cooked ham</p>
                </div>
                <span class="status">✓</span>
            </div>

            <div class="ingredient">
                <span>🧀</span>
                <div>
                    <strong>Cheese</strong>
                    <p>Delicious French cheese</p>
                </div>
                <span class="status">✓</span>
            </div>

            <div class="ingredient">
                <span>🧈</span>
                <div>
                    <strong>Butter</strong>
                    <p>A smooth, creamy finish</p>
                </div>
                <span class="status">✓</span>
            </div>

            <p class="note">Bon appétit ! 🚆</p>
        </div>
    </main>

</body>
</html>
