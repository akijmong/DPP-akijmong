<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>It's over 9000</title>
    <link rel="stylesheet" href="calc.css">
    <script src="calc.js" defer></script>
</head>
<body>
    <main class="calculator">
        <h1>Basic Calculator</h1>

        <form id="calc-form">
            <input
                type="text"
                id="left"
                placeholder="First number"
                inputmode="numeric"
                required
            >

            <select id="operator">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
                <option value="%">%</option>
            </select>

            <input
                type="text"
                id="right"
                placeholder="Second number"
                inputmode="numeric"
                required
            >

            <input type="submit" value="Try me!">
        </form>
    </main>
</body>
</html>
