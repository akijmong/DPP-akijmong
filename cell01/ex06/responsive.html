<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        table {
            width: 100%;
            height: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }

        td {
            width: 50%;
            border: 1px solid black;
            overflow-wrap: anywhere;
        }

        .first {
            background-color: #c5c981;
        }

        .second {
            background-color: #f7c2ad;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="first">Piscine</td>
            <td class="second">Web</td>
        </tr>
    </table>
</body>
</html>
